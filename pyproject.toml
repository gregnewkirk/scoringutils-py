[project]
name = "scoringutils-py"
version = "0.1.0"
description = "Unofficial Python port of the R package scoringutils for evaluating quantile and sample forecasts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gregory M. Newkirk" }]
keywords = ["forecasting", "forecast evaluation", "scoring rules", "epidemiology", "WIS", "CRPS"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scoringrules>=0.9,<0.12",  # 0.11 needs Python >= 3.12; 0.9 covers 3.10 and 3.11
]

[project.urls]
Upstream = "https://github.com/epiforecasts/scoringutils"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scoringutils_py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::pandas.errors.PerformanceWarning"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
