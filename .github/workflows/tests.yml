name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync -p ${{ matrix.python-version }}
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Check the built wheel imports
        run: |
          uv venv /tmp/wheelcheck -p 3.12
          uv pip install --python /tmp/wheelcheck/bin/python dist/*.whl
          /tmp/wheelcheck/bin/python -c "import scoringutils_py as su; print(su.__version__)"
